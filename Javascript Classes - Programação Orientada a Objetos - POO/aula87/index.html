<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de validação</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">
</head>
<body>
    <main>
        <form action="/" method="post" autocomplete="on" class="formulario">
            <div id="titulo">
                <h2>Formulário de cadastro</h2>
                <ul>
                    <li>Nenhum campo obrigatorio pode estar vazio</li>
                    <li>Usuário só poderá conter letrar e/ou números</li>
                    <li>Usuário deverá ter entre 5 e 15 caracteres</li>
                    <li>Senha deverá ter entre 6 e 12 caracteres</li>
                </ul>
            </div>
                <div id="inputs">
                    <div class="inputs" id="idnome">
                        <label for="inome">Nome:</label>
                        <input type="text" name="nome" id="inome" class="nome validar" autofocus>
                    </div>
                    <div class="inputs">
                        <label for="isobrenome">Sobrenome:</label>
                        <input type="text" name="sobrenome" id="isobrenome" class="sobrenome validar">
                    </div>
                    <div class="inputs">
                        <label for="icpf">CPF:</label>
                        <input type="text" name="cpf" id="icpf" class="cpf validar">
                    </div>
                    <div class="inputs">
                        <label for="iusuario">Usuário:</label>
                        <input type="text" name="usuario" id="iusuario" class="usuario validar">
                    </div>
                    <div class="inputs">
                        <label for="isenha">Senha:</label>
                        <input type="password" name="senha" id="isenha" class="senha validar">
                        <i class="lnr lnr-eye"></i>
                    </div>
                    <div class="inputs">
                        <label for="irepetir">Repetir Senha:</label>
                        <input type="password" name="repetir" id="irepetir" class="repetir-senha validar">
                        <i class="lnr lnr-eye"></i>
                    </div>
                    <div class="inputs"><button id="enviar" type="submit">Enviar</button></div>

                </div>
        </form>
    </main>
    <script src="assets/js/validaCpf.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/olho.js"></script>
</body>
</html>
