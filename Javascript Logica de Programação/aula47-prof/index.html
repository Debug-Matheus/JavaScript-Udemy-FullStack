<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio com NodeList</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <section class="container">
        <h1>Meu timer</h1>
        <div class="paragrafos">
            <p>00:00:00</p>
        </div>
        <div class="botoes">
            <button id="iniciar" >Iniciar</button>
            <button id="pausar" >Pausar</button>
            <button id="zerar" >Zerar</button>
        </div>
    </section>
    <script>
           
        function relogio(){
            function criarHoraSegundo(segundos){
                const data = new Date(segundos * 1000) // 1000ms = 1s
                return data.toLocaleTimeString('pt-BR',{
                    timeZone:'UTC' //Está considerando 01 de janeiro de 1970 00:00:00
                });
            }
        // console.log(criarHoraSegundo(10)) // 00:00:10

            const relogio = document.querySelector('.paragrafos p');
            const iniciar = document.getElementById('iniciar')
            const pausar = document.getElementById('pausar')
            const zerar = document.getElementById('zerar')
            let segundos = 0;
            let timer;
            function iniciaRelogio(){
                timer = setInterval(function(){
                    segundos++
                    relogio.innerHTML = criarHoraSegundo(segundos)
                },1000)
                
            }
            document.addEventListener('click', function(e){
                const el = e.target

                if(el.id === 'iniciar'){
                    clearInterval(timer)
                    iniciaRelogio()
                    relogio.classList.remove('pausado')
                }
                if(el.id === 'pausar'){
                    clearInterval(timer)
                    relogio.classList.add('pausado')
                }
                if(el.id === 'zerar'){
                    clearInterval(timer)
                    relogio.innerHTML = '00:00:00'
                    segundos = 0;
                    relogio.classList.remove('pausado')
                }
            })
        }
        relogio()
        
        
    </script>
</body>
</html>
