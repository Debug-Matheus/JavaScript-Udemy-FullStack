<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>try/catch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #125e75;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            
        }
        span{
            padding: 10px;
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <main>
        <section class="container">
            <input id="n1">
            <span>+</span>
            <input id="n2">
            <button id="calc">Somar</button>

        </section>
        <ul id="result">
            
        </ul>
    </main>
    <script>
        const n1 = document.querySelector('#n1')
        const n2 = document.querySelector('#n2')
        const botao = document.querySelector('#calc')
        const exibir = document.querySelector('#result')
        function calcular(valor1, valor2){
            if(valor1.trim() === ''|| valor2.trim() === ''){
                throw new Error('Campo vazio')
                
            }
            const n1 = Number(valor1)
            const n2 = Number(valor2)
            if(isNaN(n1)|| isNaN(n2)){
                throw new Error('Precisa ser um número')
            }

            return n1 + n2
        }
        botao.addEventListener('click', function(e){
            const el = e.target
            if(el.id === 'calc'){
                try{
                    const soma = calcular(n1.value, n2.value)
                    const li = document.createElement('li')
                    li.innerText = soma
                    exibir.appendChild(li)
                }catch(err){
                    alert(err.message)
                }finally{
                    n1.value = ''
                    n2.value = ''
                    n1.focus()
                }
            }
        })
    </script>
</body>

</html>
