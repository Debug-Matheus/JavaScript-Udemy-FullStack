<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #125e75;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            
        }
        span{
            padding: 10px;
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <main>
        <section class="container">
            
            <button id="clique">Clique</button>

        </section>
        
    </main>
    <script>
        const clique = document.querySelector('#clique')

        clique.addEventListener('click', function(){
            clique.disabled = true
            clique.textContent = 'Aguarde 3s'

            setTimeout(function(){
                clique.disabled = false
                clique.textContent = 'Clique'
            },3000)
        })
    </script>
</body>

</html>
